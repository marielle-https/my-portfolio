<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marielle Anne D. Del Mar | BSIT Student Portfolio</title>
    <meta name="description" content="Portfolio of a BSIT student: software development projects, technical skills, education, and contact information." />
    <meta name="theme-color" content="#05080D" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Marielle Anne D. Del Mar | BSIT Student Portfolio" />
    <meta property="og:description" content="Building practical solutions through code. Projects, skills, and contact details." />
    <meta property="og:image" content="/images/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply saved or system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
